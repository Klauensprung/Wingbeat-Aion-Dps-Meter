<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="256" viewBox="0 0 1440 256" role="img" aria-labelledby="title description">
  <title id="title">Wingbeat live capture setup</title>
  <desc id="description">After extracting Wingbeat: install Npcap, connect Aion 2, start capture, and open the DPS and cooldown overlays.</desc>
  <rect width="1440" height="256" rx="18" fill="#10151f"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="26" y="46" fill="#e7edf7" font-size="24" font-weight="600">From setup to overlays</text>
    <text x="1416" y="45" text-anchor="end" fill="#a8b6c9" font-size="15">WINDOWS x64</text>
<g transform="translate(24,76)">
      <rect width="330" height="156" rx="14" fill="#171f2c" stroke="#304253"/>
      <circle cx="35" cy="34" r="16" fill="#55d6be"/>
      <text x="35" y="40" text-anchor="middle" fill="#10151f" font-size="17" font-weight="700">1</text>
      <path transform="translate(270,18)" d="M5 3h22v22H5z M16 7v12 M11 14l5 5 5-5 M10 25v4h12v-4" fill="none" stroke="#55d6be" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="22" y="91" fill="#e7edf7" font-size="24" font-weight="600">Install Npcap</text>
      <text x="22" y="123" fill="#a8b6c9" font-size="16">The driver for live capture</text>
    </g>
<path d="M361 145l7 7-7 7" fill="none" stroke="#55d6be" stroke-width="2"/>
<g transform="translate(378,76)">
      <rect width="330" height="156" rx="14" fill="#171f2c" stroke="#304253"/>
      <circle cx="35" cy="34" r="16" fill="#55d6be"/>
      <text x="35" y="40" text-anchor="middle" fill="#10151f" font-size="17" font-weight="700">2</text>
      <path transform="translate(270,18)" d="M3 5h26v19H3z M11 29h10 M16 24v5 M13 10l8 5-8 5z" fill="none" stroke="#55d6be" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="22" y="91" fill="#e7edf7" font-size="24" font-weight="600">Start Aion 2</text>
      <text x="22" y="123" fill="#a8b6c9" font-size="16">Connect to a game server</text>
    </g>
<path d="M715 145l7 7-7 7" fill="none" stroke="#55d6be" stroke-width="2"/>
<g transform="translate(732,76)">
      <rect width="330" height="156" rx="14" fill="#171f2c" stroke="#304253"/>
      <circle cx="35" cy="34" r="16" fill="#55d6be"/>
      <text x="35" y="40" text-anchor="middle" fill="#10151f" font-size="17" font-weight="700">3</text>
      <path transform="translate(270,18)" d="M4 10h24 M4 22h24 M10 4v12 M22 16v12 M4 7v6 M28 19v6" fill="none" stroke="#55d6be" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="22" y="91" fill="#e7edf7" font-size="24" font-weight="600">Start capture</text>
      <text x="22" y="123" fill="#a8b6c9" font-size="16">Adapter detected automatically</text>
    </g>
<path d="M1069 145l7 7-7 7" fill="none" stroke="#55d6be" stroke-width="2"/>
<g transform="translate(1086,76)">
      <rect width="330" height="156" rx="14" fill="#171f2c" stroke="#304253"/>
      <circle cx="35" cy="34" r="16" fill="#55d6be"/>
      <text x="35" y="40" text-anchor="middle" fill="#10151f" font-size="17" font-weight="700">4</text>
      <path transform="translate(270,18)" d="M3 4h26v24H3z M3 10h26 M8 23v-5 M14 23v-9 M20 23v-7 M26 23v-4" fill="none" stroke="#55d6be" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="22" y="91" fill="#e7edf7" font-size="24" font-weight="600">Open overlays</text>
      <text x="22" y="123" fill="#a8b6c9" font-size="16">DPS and tracked cooldowns</text>
    </g>
